services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-equityos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-equityos}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Inside the compose network the database host is the service name `db`, port 5432.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-equityos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-equityos}
      CORS_ORIGINS: '["http://localhost:3000"]'
      # LLM keys come from .env (never baked into the image); empty = provider unused.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
    # The SAME folder your machine uses (DATA_DIR, default ./data): documents, HTTP cache and the
    # manual-ingestion inbox are shared between local runs and Docker, and survive container
    # rebuilds and `docker compose down -v` because they live on your disk, not in the container.
    # On Linux, set DATA_UID/DATA_GID to the owner of ./data (`id -u` / `id -g`).
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    volumes:
      - ${DATA_HOST_DIR:-./data}:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
