name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: equityos
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: equityos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equityos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://equityos:ci-password@localhost:5432/equityos
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # the models and the migrations must describe the same database
      - run: alembic upgrade head
      - run: alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      # `next build` also type-checks the project.
      - run: npm run build

  docker:
    # The backend image carries Tesseract (OCR of scanned filings); build it and prove it works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t equityos-backend ./backend
      - run: docker run --rm equityos-backend tesseract --version
      - run: docker run --rm equityos-backend python -c "import app.main"
