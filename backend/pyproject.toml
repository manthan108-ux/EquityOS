[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated and hand-tuned migrations contain long SQL/constraint lines.
"migrations/versions/*" = ["E501", "I001", "UP"]
"tests/*" = ["E501"]  # fixtures contain long CSV lines
# Provider spec files carry long human-readable descriptions (terms, coverage, limits).
"app/providers/adapters.py" = ["E501"]
"app/providers/upstox.py" = ["E501"]
"app/providers/manual.py" = ["E501"]
"app/coverage.py" = ["E501"]
# Report prose and layout tables are long, readable literals.
"app/research/pdf_pro.py" = ["E501"]
"app/research/analysis.py" = ["E501"]
"app/research/valuation.py" = ["E501"]
"app/research/thesis.py" = ["E501"]
"app/research/mgmt.py" = ["E501"]
"app/research/sectors.py" = ["E501"]
"app/research/pdf_analysis.py" = ["E501"]
"app/research/compat.py" = ["E501"]
"app/research/verdict.py" = ["E501"]
"app/research/pdf_sections.py" = ["E501"]
"app/research/profile.py" = ["E501"]
"app/research/cyclicality.py" = ["E501"]
"app/research/industry.py" = ["E501"]
"tests/fixtures/*" = ["E501"]
"app/providers/cli.py" = ["E501"]
# Label patterns are regular expressions; splitting them hurts readability.
"app/docintel/taxonomy.py" = ["E501"]
